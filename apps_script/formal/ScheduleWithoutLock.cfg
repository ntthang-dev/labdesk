\* Same model with the script lock removed: proves the lock is what prevents
\* two concurrent book() requests from both claiming one slot.
SPECIFICATION Spec
CONSTANTS
    Students = {s1, s2}
    Machines = {m1, m2}
    Slots = {t1, t2}
    CurrentSlot = t1
    MaxBookings = 2
    UseLock = FALSE
    EnforceReservation = TRUE
INVARIANTS
    TypeOK
    NoDoubleBookedSlot
    OneMachinePerStudentPerSlot
    CapRespected
    NoWalkupStealsReservation
